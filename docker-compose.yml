# The whole stack with one command:   docker compose up --build
#   web    http://localhost:8080   React app (nginx), which also proxies /api to the API
#   api    http://localhost:8000   FastAPI; interactive docs at /docs
#   db     PostgreSQL on localhost:5432 (user/password/db: nexusflow)
#   redis  Redis on localhost:6379 (stats cache and login rate limits)
# Every port is bound to 127.0.0.1, so only this computer can reach them. The passwords here are
# local throwaways, never used anywhere else.
name: nexusflow

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nexusflow
      POSTGRES_PASSWORD: nexusflow
      POSTGRES_DB: nexusflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusflow -d nexusflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://nexusflow:nexusflow@db:5432/nexusflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-docker-secret-not-for-production-000000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_DEMO: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
