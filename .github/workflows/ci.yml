# Runs on every push and pull request: both apps must lint, type-check, pass their tests and
# build, and both Docker images must build, before anything is merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: API (ruff, migrations, pytest on PostgreSQL + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nexusflow
          POSTGRES_PASSWORD: nexusflow
          POSTGRES_DB: nexusflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexusflow" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nexusflow:nexusflow@localhost:5432/nexusflow
      TEST_DATABASE_URL: postgresql+psycopg://nexusflow:nexusflow@localhost:5432/nexusflow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # The migrations must build the exact schema the models describe.
      - run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexusflow-api ./api
      - run: docker build -t nexusflow-web ./web
