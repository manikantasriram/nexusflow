[project]
name = "nexusflow-api"
version = "0.1.0"
description = "NexusFlow API: multi-tenant projects, Kanban tasks and document intelligence"
requires-python = ">=3.14"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, naming
select = ["F", "E", "W", "I", "B", "UP", "SIM", "N"]
ignore = [
  "B008",   # FastAPI's Depends() in defaults is the intended pattern
  "SIM905", # a word list written as one string reads better than 150 quoted items
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
