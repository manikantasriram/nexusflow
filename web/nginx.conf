server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # The API, on the same origin as the app, so the refresh-token cookie needs no cross-site rules.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 3m; # document uploads are capped at 2 MB by the API
  }

  # Built files have a content hash in their name, so they can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: any other path is handled by React Router.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
